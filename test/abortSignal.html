<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARIA tree walker Test</title>
  </head>
  <body>
    <span role="img" data-owns="treeitem1 treeitem2" aria-label="test tree 1" data-label="test tree 1" data-owns-id="root" tabindex="0">
      <span
        data-owns-id="treeitem1"
        data-owns="treeitem3"
        data-label="item 1.1"
      ></span>
      <span
        data-owns-id="treeitem2"
        data-label="item 1.2"
      ></span>
      <span
        data-owns-id="treeitem3"
        data-label="item 1.1.1"
      ></span>
    </span>

    <script type="module">
      import { attachNavigator } from "/dist/aria-tree-walker.js";
      // expose to let test call it
      window.controller = new AbortController();
      attachNavigator(document.querySelector('[role="img"]'), controller.signal);
    </script>
  </body>
</html>
