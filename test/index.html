<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIA tree walker Test</title>
</head>

<body>
  <svg role="img" data-owns="treeitem1 treeitem2" aria-label="test tree 1" data-label="test tree 1" data-owns-id="root"
    tabindex="0" viewbox="0 0 100 100" width="100" height="100">
    <g data-owns-id="treeitem1" data-owns="treeitem3" data-label="item 1.1" aria-hidden="true">
      <circle cx="10" cy="10" r="5" />
    </g>
    <g data-owns-id="treeitem2" data-label="item 1.2" aria-hidden="true">
      <circle cx="20" cy="10" r="5" />
    </g>
    <g data-owns-id="treeitem3" data-label="item 1.1.1" aria-hidden="true">
      <circle cx="10" cy="20" r="5" />
    </g>
  </svg>

  <span role="img" data-owns="treeitem1 treeitem2" aria-label="test tree 2" data-label="test tree 2" tabindex="0">
    <span data-owns-id="treeitem1" data-label="item 2.1" aria-hidden="true"></span>
    <a data-owns-id="treeitem2" data-label="item 2.2" aria-label="item 2.2" href="https://example.com"></a>
  </span>

  <svg role="img" data-owns="treeitem1" aria-label="test tree 3" data-label="test tree 3" data-owns-id="root"
    tabindex="0" viewbox="0 0 100 100" width="100" height="100">
    <g data-owns-id="treeitem1" data-owns="treeitem2 treeitem3" data-label="level 1" aria-hidden="true">
      <circle cx="15" cy="10" r="5" />
    </g>
    <a href="#" data-owns-id="treeitem3" data-label="leaf 1">
      <circle cx="20" cy="20" r="5" />
    </a>
    <g id="deepId" data-owns-id="treeitem2" data-label="leaf 2" aria-hidden="true">
      <circle cx="10" cy="20" r="5" />
    </g>
  </svg>

  <!-- test error catching -->
  <span role="img" aria-label="bad tree" tabindex="0"></span>
  <span role="img" data-owns aria-label="bad tree 2" tabindex="0"></span>
  <span role="img" data-owns="notarget" aria-label="bad tree 3" tabindex="0"></span>

  <script type="module">
    import { attachNavigator } from "../lib/navigator.js";
    document.querySelectorAll('[role="img"]').forEach(attachNavigator);
  </script>
</body>

</html>
